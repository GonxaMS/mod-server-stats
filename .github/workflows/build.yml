name: Build mod and Android app

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modserverstats
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Android APK for embedded update
        uses: actions/download-artifact@v4
        with:
          name: mod-server-stats-android-apk
          path: android-app/app/build/outputs/apk/debug

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          export JAVA21_HOME="$JAVA_HOME"
          ./gradlew build

      - name: Upload NeoForge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-server-stats-neoforge-jar
          path: modserverstats/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable Android signing key
        if: ${{ env.ANDROID_SIGNING_KEYSTORE_B64 != '' }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_B64"
          mkdir -p signing
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > signing/modserverstats-release.jks
          test -s signing/modserverstats-release.jks

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/android-app/signing/modserverstats-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Android APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mod-server-stats-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mod, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-server-stats-neoforge-jar
          path: release

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: mod-server-stats-android-apk
          path: release

      - name: Prepare release assets and manifest
        shell: bash
        run: |
          final_jar=$(find release -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$final_jar"
          mv "$final_jar" release/mod-server-stats-neoforge.jar
          find release -maxdepth 1 -type f -name '*-dev.jar' -delete
          version_code=$(sed -nE 's/.*versionCode[[:space:]]+([0-9]+).*/\1/p' android-app/app/build.gradle | head -n 1)
          version_name=$(sed -nE "s/.*versionName[[:space:]]+'([^']+)'.*/\1/p" android-app/app/build.gradle | head -n 1)
          test -n "$version_code"
          test -n "$version_name"
          apk_name="mod-server-stats-app-v${version_name}.apk"
          mv release/app-debug.apk "release/${apk_name}"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "downloadUrl": "https://github.com/%s/releases/latest/download/mod-server-stats-app.apk",\n  "releaseNotes": "Versión publicada desde GitHub Releases"\n}\n' \
            "$version_code" "$version_name" "$GITHUB_REPOSITORY" > release/latest.json
          sed -i "s/mod-server-stats-app\\.apk/${apk_name}/g" release/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mod Server Stats $GITHUB_REF_NAME" \
            --generate-notes
